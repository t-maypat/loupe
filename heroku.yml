# Heroku container-stack deploy for the Loupe backend (see README "Deployment").
# Enable with: `heroku stack:set container`. Heroku builds the image from the
# repo root (so /repo/backend + /repo/data mirror the repo, matching the path
# resolution in backend/app/agent/runtime.py) and runs the web process below,
# binding Heroku's dynamically assigned $PORT.
build:
  docker:
    web: backend/Dockerfile
run:
  web: uvicorn app.main:app --host 0.0.0.0 --port $PORT
